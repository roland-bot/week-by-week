<body>
  <p id="week-display">Where are we in the semester? The semester hasn't started yet.</p>

  <script>
    // --------------------------
    // Utility: Australia/Sydney date handling
    // --------------------------
    function nowInSydney() {
      const s = new Date().toLocaleString('en-AU', { timeZone: 'Australia/Sydney' });
      return new Date(s);
    }
    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0); } // midday avoids DST edges
    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return startOfDay(x); }
    function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    function nextMondayOnOrAfter(year, monthIndex, day) {
      let d = startOfDay(new Date(year, monthIndex, day));
      while (d.getDay() !== 1) d = addDays(d, 1); // 1 = Monday
      return d;
    }
    function lastMondayInSeptember(year) {
      let d = startOfDay(new Date(year, 8, 30)); // 30 Sep
      while (d.getDay() !== 1) d = addDays(d, -1);
      return d;
    }

    // --------------------------
    // Easter Monday (Anonymous Gregorian algorithm)
    // --------------------------
    function easterSunday(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31) - 1; // 0=Jan
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return startOfDay(new Date(year, month, day));
    }
    function easterMonday(year) { return addDays(easterSunday(year), 1); }
