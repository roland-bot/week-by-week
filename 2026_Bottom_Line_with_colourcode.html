
<!DOCTYPE html>
<html>
<head>
  <title>Semester Week</title>
  <meta charset="utf-8">
</head>
<body>

<p style="border-bottom: 2px dotted #28426a;
         padding: 10px;  
         margin-bottom: 0px;
         font-size: 14pt; 
         color: rgb(45, 59, 69); 
         text-align: center; 
         font-family: 'Century Gothic', Calibri, Helvetica, Arial, sans-serif; 
         overflow: hidden;
         font-weight: bold;" 
   id="week-display">
  Where are we in the semester? The semester hasn't started yet.
</p>

<script> // [N.B: if you want to change how the box and text looks in terms of styling, do so in the line above]

  // -----------------------------
  // Configuration (Semester 1 & 2)
  // -----------------------------
  const semesterConfigs = {
    1: {
      name: "Semester 1",
      startDate: "2026-02-23",   // Update to your official start date if needed
      teachingWeeks: 13,
      breakAfterWeek: 6,         // break after Week 6
      breakLengthWeeks: 1,       // one-week mid-semester break
      preWeeks: 7                // Weeks -7 .. -1
    },
    2: {
      name: "Semester 2",
      startDate: "2026-08-03",   // UPDATED: Semester 2 starts on 3 August 2026
      teachingWeeks: 13,
      breakAfterWeek: 6,
      breakLengthWeeks: 1,
      preWeeks: 7
    }
  };

  // -----------------------------
  // Colour palette (accessible)
  // -----------------------------
  const weekTypeStyles = {
    pre:      { bg: "#E3F2FD", text: "#0D47A1", border: "#1565C0" }, // light blue
    teaching: { bg: "#E8F5E9", text: "#1B5E20", border: "#2E7D32" }, // light green
    break:    { bg: "#FFF3E0", text: "#E65100", border: "#EF6C00" }, // light orange
    stuvac:   { bg: "#FFFDE7", text: "#F57F17", border: "#F9A825" }, // light yellow
    exam:     { bg: "#FFEBEE", text: "#B71C1C", border: "#C62828" }, // light red
    finished: { bg: "#ECEFF1", text: "#37474F", border: "#607D8B" }, // grey
    outside:  { bg: "#ECEFF1", text: "#37474F", border: "#607D8B" }  // grey
  };

  function applyWeekStyle(el, type) {
    const style = weekTypeStyles[type] || weekTypeStyles.outside;
    el.style.backgroundColor = style.bg;
    el.style.color = style.text;
    el.style.borderBottomColor = style.border;
  }

  // -----------------------------
  // Utilities (DST-safe and simple)
  // -----------------------------
  function addDaysYMD(ymd, days) {
    const [y, m, d] = ymd.split("-").map(Number);
    const utcMs = Date.UTC(y, m - 1, d);
    const next = new Date(utcMs + days * 86400000);
    const yy = next.getUTCFullYear();
    const mm = String(next.getUTCMonth() + 1).padStart(2, "0");
    const dd = String(next.getUTCDate()).padStart(2, "0");
    return `${yy}-${mm}-${dd}`;
  }

  function ymdKey(ymd) {
    return Number(ymd.replaceAll("-", ""));
  }

  function buildWeekStartDates(config) {
    const { startDate, teachingWeeks, breakAfterWeek, breakLengthWeeks, preWeeks } = config;
    const boundaries = [];

    // Pre-weeks (-7 .. -1)
    for (let i = preWeeks; i >= 1; i--) {
      boundaries.push(addDaysYMD(startDate, -7 * i));
    }

    // Teaching weeks before break (1 .. breakAfterWeek)
    for (let w = 1; w <= breakAfterWeek; w++) {
      boundaries.push(addDaysYMD(startDate, 7 * (w - 1)));
    }

    // Mid-semester break (if any)
    if (breakLengthWeeks > 0) {
      boundaries.push(addDaysYMD(startDate, 7 * breakAfterWeek));
    }

    // Remaining teaching weeks (breakAfterWeek+1 .. teachingWeeks)
    for (let w = breakAfterWeek + 1; w <= teachingWeeks; w++) {
      boundaries.push(addDaysYMD(startDate, 7 * (w - 1 + breakLengthWeeks)));
    }

    // STUVAC + Exam Week 1 + Exam Week 2 + End boundary
    boundaries.push(addDaysYMD(startDate, 7 * (teachingWeeks + breakLengthWeeks)));         // STUVAC
    boundaries.push(addDaysYMD(startDate, 7 * (teachingWeeks + breakLengthWeeks + 1)));     // Exam Week 1
    boundaries.push(addDaysYMD(startDate, 7 * (teachingWeeks + breakLengthWeeks + 2)));     // Exam Week 2
    boundaries.push(addDaysYMD(startDate, 7 * (teachingWeeks + breakLengthWeeks + 3)));     // End boundary

    return boundaries;
  }

  function currentSydneyYMD() {
    const parts = new Intl.DateTimeFormat("en-AU", {
      timeZone: "Australia/Sydney",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const get = (type) => parts.find(p => p.type === type).value;
    return `${get("year")}-${get("month")}-${get("day")}`;
  }

  function getDayNameSydney() {
    return new Intl.DateTimeFormat("en-AU", {
      timeZone: "Australia/Sydney",
      weekday: "long"
    }).format(new Date()); // e.g., "Thursday"
  }

  function getWeekNumber(currentYMD, boundaries) {
    const k = ymdKey(currentYMD);
    const first = ymdKey(boundaries[0]);
    const last = ymdKey(boundaries[boundaries.length - 1]);

    if (k < first) return -1;
    for (let i = 0; i < boundaries.length - 1; i++) {
      const a = ymdKey(boundaries[i]);
      const b = ymdKey(boundaries[i + 1]);
      if (k >= a && k < b) return i + 1; // 1-based
    }
    if (k >= last) return boundaries.length; // finished
    return -1;
  }

  // Returns { text: string, isPreMessage: boolean, type: string }
  function getWeekLabel(i, dayName, config, boundariesCount) {
    const { preWeeks, teachingWeeks, breakAfterWeek, breakLengthWeeks, name } = config;

    if (i < 0) {
      return { text: "The semester hasn't started yet.", isPreMessage: false, type: "outside" };
    }
    if (i >= boundariesCount - 1) {
      return { text: "The semester has finished.", isPreMessage: false, type: "finished" };
    }

    // Pre-semester weeks: "Semester X commences in x weeks."
    if (i < preWeeks) {
      const weeksUntilStart = preWeeks - i; // 7..1
      const plural = weeksUntilStart === 1 ? "" : "s";
      return { text: `${name} commences in ${weeksUntilStart} week${plural}.`, isPreMessage: true, type: "pre" };
    }

    // Teaching weeks before break
    if (i < preWeeks + breakAfterWeek) {
      const wk = i - preWeeks + 1;
      return { text: `It is ${dayName} of Week ${wk}.`, isPreMessage: false, type: "teaching" };
    }

    // Mid-semester break (hyphenated)
    if (breakLengthWeeks > 0 && i === preWeeks + breakAfterWeek) {
      return { text: `It is ${dayName} of the mid-semester break.`, isPreMessage: false, type: "break" };
    }

    // Remaining teaching weeks
    const teachingEndIndex = preWeeks + teachingWeeks + breakLengthWeeks - 1;
    if (i <= teachingEndIndex) {
      const wk = i - preWeeks - breakLengthWeeks + 1;
      return { text: `It is ${dayName} of Week ${wk}.`, isPreMessage: false, type: "teaching" };
    }

    // STUVAC and exams
    if (i === preWeeks + teachingWeeks + breakLengthWeeks)
      return { text: `It is ${dayName} of STUVAC.`, isPreMessage: false, type: "stuvac" };
    if (i === preWeeks + teachingWeeks + breakLengthWeeks + 1)
      return { text: `It is ${dayName} of Exam Week 1.`, isPreMessage: false, type: "exam" };
    if (i === preWeeks + teachingWeeks + breakLengthWeeks + 2)
      return { text: `It is ${dayName} of Exam Week 2.`, isPreMessage: false, type: "exam" };

    return { text: `${dayName}`, isPreMessage: false, type: "outside" };
  }

  // -----------------------------
  // Auto-detect semester & render
  // -----------------------------
  const currentYMD = currentSydneyYMD();
  const dayName = getDayNameSydney();
  const targetEl = document.getElementById("week-display");

  let rendered = false;
  for (const cfg of Object.values(semesterConfigs)) {
    const boundaries = buildWeekStartDates(cfg);
    const firstBoundary = boundaries[0];
    const lastBoundary = boundaries[boundaries.length - 1];

    if (ymdKey(currentYMD) >= ymdKey(firstBoundary) && ymdKey(currentYMD) <= ymdKey(lastBoundary)) {
      const weekNumber = getWeekNumber(currentYMD, boundaries);
      const { text, isPreMessage, type } = getWeekLabel(weekNumber - 1, dayName, cfg, boundaries.length);

      const finalText = isPreMessage ? text : `${cfg.name}: ${text}`;
      targetEl.innerHTML = finalText;
      applyWeekStyle(targetEl, type);

      rendered = true;
      break;
    }
  }

  if (!rendered) {
    targetEl.innerHTML = "Outside semester dates.";
    applyWeekStyle(targetEl, "outside");
  }
</script>

</body>
</html>
